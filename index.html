<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">العد التنازلي لبكالوريا 2027</title>
    <meta name="description" id="meta-desc" content="موقع لعرض العد التنازلي لبكالوريا الجزائر 2027. يساعد التلاميذ على معرفة الوقت المتبقي.">
    <!-- Favicon 🎓 -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff4e50;
            --dark: #121212;
            --light: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-glow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Switcher de langue */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 15px;
        }

        html[dir="ltr"] .lang-switcher {
            right: 20px;
            left: auto;
        }
        
        html[dir="rtl"] .lang-switcher {
            left: 20px;
            right: auto;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 2px solid transparent;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.8rem;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .lang-btn:hover, .lang-btn.active {
            background: rgba(255, 255, 255, 0.4);
            border-color: var(--accent);
            transform: scale(1.1);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 20;
            padding-top: 5rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 1.5s ease-out;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin: 0 1rem;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .countdown-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .countdown-table th {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            padding: 1.2rem 0.5rem;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .countdown-table td {
            text-align: center;
            padding: 1.5rem 0.5rem;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: var(--text-glow);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-section {
            margin-top: 2rem;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .progress-title {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .progress-container {
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 10px;
            width: 0%;
            transition: width 0.5s ease-out;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 2s infinite;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #ccc;
        }

        .message-container {
            text-align: center;
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--card-bg);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #message {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        #quote {
            font-size: 1.1rem;
            font-style: italic;
            opacity: 0.8;
        }

        /* العلم الجزائري أعلى يسار (RTL) أو يمين (LTR) */
        .dz-flag-top {
            position: fixed;
            top: 20px;
            width: 70px;
            height: 45px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Flag_of_Algeria.svg/1280px-Flag_of_Algeria.svg.png') no-repeat center/cover;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            z-index: 100;
        }

        html[dir="rtl"] .dz-flag-top {
            right: 20px;
            left: auto;
        }

        html[dir="ltr"] .dz-flag-top {
            left: 20px;
            right: auto;
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            opacity: 0;
            animation: float 15s infinite linear;
        }

        /* --------- BOUTON DISCORD --------- */
        .discord-button {
            text-align: center;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        .discord-button a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #5865F2; /* Couleur Discord */
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .discord-button a:hover {
            background: #4752C4;
            transform: translateY(-3px);
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .countdown-table th { font-size: 1rem; }
            .countdown-table td { font-size: 1.4rem; }
            #message { font-size: 1.2rem; }
            .dz-flag-top { width: 50px; height: 30px; top: 15px; }
            .container { padding-top: 6rem; }
            .lang-switcher { gap: 10px; }
            .lang-btn { width: 40px; height: 40px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="changeLanguage('ar')" id="btn-ar" title="العربية">🇩🇿</button>
        <button class="lang-btn" onclick="changeLanguage('fr')" id="btn-fr" title="Français">🇫🇷</button>
        <button class="lang-btn" onclick="changeLanguage('en')" id="btn-en" title="English">🇬🇧</button>
    </div>

    <div class="dz-flag-top"></div>
    <div class="particles-container" id="particles"></div>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-graduation-cap logo-icon"></i>
                <h1 id="ui-title">العد التنازلي لبكالوريا 2027</h1>
            </div>
            <p class="subtitle" id="ui-subtitle">استعد لأهم اختبار في مسيرتك التعليمية، كل ثانية تمر تقربك من تحقيق حلمك</p>
        </header>

        <table class="countdown-table">
            <tr>
                <th id="th-weeks">أسابيع</th>
                <th id="th-days">أيام</th>
                <th id="th-hours">ساعات</th>
                <th id="th-minutes">دقائق</th>
                <th id="th-seconds">ثواني</th>
            </tr>
            <tr>
                <td id="weeks">0</td>
                <td id="days">0</td>
                <td id="hours">0</td>
                <td id="minutes">0</td>
                <td id="seconds">0</td>
            </tr>
        </table>

        <div class="progress-section">
            <h3 class="progress-title" id="ui-progress-title">التقدم نحو البكالوريا</h3>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-info">
                <span id="ui-start-date">06 سبتمبر 2026</span>
                <span id="progress-percentage">0%</span>
                <span id="ui-end-date">07 يونيو 2027</span>
            </div>
        </div>

        <div class="message-container">
            <p id="message"></p>
            <p id="quote"></p>
        </div>

        <!-- Bouton Discord -->
        <div class="discord-button">
            <a href="https://discord.gg/tZs4auXv" target="_blank" id="ui-discord-btn">
                <i class="fab fa-discord"></i> انضم إلى خادمنا
            </a>
        </div>
    </div>

    <script>
        // Base de données de traduction
        const i18n = {
            ar: {
                dir: "rtl",
                pageTitle: "العد التنازلي لبكالوريا 2027",
                metaDesc: "موقع لعرض العد التنازلي لبكالوريا الجزائر 2027. يساعد التلاميذ على معرفة الوقت المتبقي.",
                uiTitle: "العد التنازلي لبكالوريا 2027",
                uiSubtitle: "استعد لأهم اختبار في مسيرتك التعليمية، كل ثانية تمر تقربك من تحقيق حلمك",
                thWeeks: "أسابيع",
                thDays: "أيام",
                thHours: "ساعات",
                thMinutes: "دقائق",
                thSeconds: "ثواني",
                uiProgressTitle: "التقدم نحو البكالوريا",
                uiStartDate: "06 سبتمبر 2026",
                uiEndDate: "07 يونيو 2027",
                uiDiscordBtn: '<i class="fab fa-discord"></i> انضم إلى خادمنا',
                msgDone: "مبروك! لقد وصلت إلى البكالوريا!",
                messages: [
                    "استمر في العمل، النجاح قريب!",
                    "كل يوم يقترب بك من هدفك!",
                    "حافظ على تركيزك، البكالوريا تقترب!",
                    "جهز نفسك وتأكد من التميز!",
                    "ثقتك بنفسك هي مفتاح نجاحك!",
                    "الاستعداد اليوم يعني النجاح غداً!",
                    "لا تؤجل ما يمكنك فعله اليوم!",
                    "كل ثانية تحسب! اصنع فرقاً الآن!"
                ],
                quotes: [
                    "النجاح هو مجموع الجهود الصغيرة التي تتكرر يومياً",
                    "ليس هناك من هو أكثر بؤساً من المرء الذي أصبح اللاقرار عادته",
                    "الطموح اللامحدود هو وقود الإنجاز",
                    "الاستعداد للامتحانات يعلمك أكثر من الامتحان نفسه",
                    "لا يوجد مصعد للنجاح، يجب أن تستخدم الدرج",
                    "النجاح ليس صدفة، إنه عمل شاق ومثابرة وتعلم",
                    "أفضل طريقة للتنبؤ بالمستقبل هي صنعه",
                    "التعليم هو أقوى سلاح يمكنك استخدامه لتغيير العالم"
                ]
            },
            fr: {
                dir: "ltr",
                pageTitle: "Compte à Rebours Bac 2027",
                metaDesc: "Un site web simple et utile pour suivre le temps restant avant le Bac Algérie 2027.",
                uiTitle: "Compte à Rebours Bac 2027",
                uiSubtitle: "Préparez-vous pour l'examen le plus important, chaque seconde vous rapproche de votre rêve",
                thWeeks: "Semaines",
                thDays: "Jours",
                thHours: "Heures",
                thMinutes: "Minutes",
                thSeconds: "Secondes",
                uiProgressTitle: "Progression vers le Bac",
                uiStartDate: "06 Septembre 2026",
                uiEndDate: "07 Juin 2027",
                uiDiscordBtn: '<i class="fab fa-discord"></i> Rejoignez notre serveur',
                msgDone: "Félicitations ! Vous avez atteint le Bac !",
                messages: [
                    "Continuez à travailler, le succès est proche !",
                    "Chaque jour vous rapproche de votre objectif !",
                    "Restez concentré, le Bac approche !",
                    "Préparez-vous et assurez l'excellence !",
                    "La confiance en soi est la clé de la réussite !",
                    "Se préparer aujourd'hui, c'est réussir demain !",
                    "Ne remettez pas à demain ce que vous pouvez faire aujourd'hui !",
                    "Chaque seconde compte ! Faites la différence maintenant !"
                ],
                quotes: [
                    "Le succès est la somme de petits efforts répétés jour après jour.",
                    "Il n'y a rien de plus misérable qu'une personne dont l'indécision est devenue une habitude.",
                    "Une ambition illimitée est le carburant de la réussite.",
                    "Se préparer aux examens vous apprend plus que l'examen lui-même.",
                    "Il n'y a pas d'ascenseur pour le succès, il faut prendre les escaliers.",
                    "Le succès n'est pas un accident, c'est du travail acharné, de la persévérance et de l'apprentissage.",
                    "La meilleure façon de prédire l'avenir est de le créer.",
                    "L'éducation est l'arme la plus puissante que l'on puisse utiliser pour changer le monde."
                ]
            },
            en: {
                dir: "ltr",
                pageTitle: "Bac 2027 Countdown",
                metaDesc: "A simple and useful website to track the remaining time before the 2027 Algerian Baccalaureate.",
                uiTitle: "Bac 2027 Countdown",
                uiSubtitle: "Prepare for the most important exam, every second brings you closer to your dream",
                thWeeks: "Weeks",
                thDays: "Days",
                thHours: "Hours",
                thMinutes: "Minutes",
                thSeconds: "Seconds",
                uiProgressTitle: "Progress towards the Bac",
                uiStartDate: "September 06, 2026",
                uiEndDate: "June 07, 2027",
                uiDiscordBtn: '<i class="fab fa-discord"></i> Join our server',
                msgDone: "Congratulations! You have reached the Baccalaureate!",
                messages: [
                    "Keep working, success is near!",
                    "Every day brings you closer to your goal!",
                    "Stay focused, the Bac is approaching!",
                    "Prepare yourself and ensure excellence!",
                    "Self-confidence is the key to success!",
                    "Preparing today means succeeding tomorrow!",
                    "Don't put off until tomorrow what you can do today!",
                    "Every second counts! Make a difference now!"
                ],
                quotes: [
                    "Success is the sum of small efforts, repeated day in and day out.",
                    "There is no one more miserable than a person whose indecision has become a habit.",
                    "Limitless ambition is the fuel of achievement.",
                    "Preparing for exams teaches you more than the exam itself.",
                    "There is no elevator to success, you have to take the stairs.",
                    "Success is no accident. It is hard work, perseverance, learning, and studying.",
                    "The best way to predict the future is to create it.",
                    "Education is the most powerful weapon which you can use to change the world."
                ]
            }
        };

        let currentLang = 'ar';

        // Nouvelles dates (Bac 2027)
        const targetDate = new Date("2027-06-07T08:00:00").getTime();
        const startDate = new Date("2026-09-06T00:00:00").getTime();

        const weeksEl = document.getElementById("weeks");
        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");
        const progressBarEl = document.getElementById("progress-bar");
        const progressPercentageEl = document.getElementById("progress-percentage");
        const messageEl = document.getElementById("message");
        const quoteEl = document.getElementById("quote");

        function changeLanguage(lang) {
            currentLang = lang;
            const data = i18n[lang];

            // Mettre à jour la direction et l'attribut lang
            document.documentElement.dir = data.dir;
            document.documentElement.lang = lang;

            // Mettre à jour le SEO
            document.getElementById("page-title").innerText = data.pageTitle;
            document.getElementById("meta-desc").setAttribute("content", data.metaDesc);

            // Mettre à jour l'interface utilisateur statique
            document.getElementById("ui-title").innerText = data.uiTitle;
            document.getElementById("ui-subtitle").innerText = data.uiSubtitle;
            document.getElementById("th-weeks").innerText = data.thWeeks;
            document.getElementById("th-days").innerText = data.thDays;
            document.getElementById("th-hours").innerText = data.thHours;
            document.getElementById("th-minutes").innerText = data.thMinutes;
            document.getElementById("th-seconds").innerText = data.thSeconds;
            document.getElementById("ui-progress-title").innerText = data.uiProgressTitle;
            document.getElementById("ui-start-date").innerText = data.uiStartDate;
            document.getElementById("ui-end-date").innerText = data.uiEndDate;
            document.getElementById("ui-discord-btn").innerHTML = data.uiDiscordBtn;

            // Mettre à jour l'état actif des boutons
            document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
            document.getElementById("btn-" + lang).classList.add("active");

            // Forcer la mise à jour immédiate des messages
            updateMessages();
        }

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 5 + 2;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                const colors = ['#ff4e50', '#fc913a', '#f9d423', '#ede574', '#e1f5c4', '#6a11cb', '#2575fc'];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = `${Math.random() * 100}%`;
                p.style.top = `${Math.random() * 100 + 100}%`;
                p.style.animationDuration = `${Math.random() * 20 + 10}s`;
                p.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(p);
            }
        }

        function updateMessages() {
            const data = i18n[currentLang];
            messageEl.textContent = data.messages[Math.floor(Math.random() * data.messages.length)];
            quoteEl.textContent = `"${data.quotes[Math.floor(Math.random() * data.quotes.length)]}"`;
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const diff = targetDate - now;
            const data = i18n[currentLang];

            if (diff < 0) {
                weeksEl.textContent = "00";
                daysEl.textContent = "00";
                hoursEl.textContent = "00";
                minutesEl.textContent = "00";
                secondsEl.textContent = "00";
                messageEl.textContent = data.msgDone;
                quoteEl.textContent = "";
                progressBarEl.style.width = "100%";
                progressPercentageEl.textContent = "100%";
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            const seconds = totalSeconds % 60;
            const totalMinutes = Math.floor(totalSeconds / 60);
            const minutes = totalMinutes % 60;
            const totalHours = Math.floor(totalSeconds / 3600);
            const hours = totalHours % 24;
            const totalDays = Math.floor(totalSeconds / (3600 * 24));
            const weeks = Math.floor(totalDays / 7);

            weeksEl.textContent = weeks;
            daysEl.textContent = totalDays;
            hoursEl.textContent = totalHours;
            minutesEl.textContent = totalMinutes;
            secondsEl.textContent = totalSeconds;

            const progressPercent = Math.min(Math.max((now - startDate) / (targetDate - startDate) * 100, 0), 100);
            progressBarEl.style.width = `${progressPercent}%`;
            progressPercentageEl.textContent = `${progressPercent.toFixed(1)}%`;

            // Mettre à jour la citation toutes les 15 secondes
            if (seconds % 15 === 0) {
                updateMessages();
            }
        }

        // Initialisation par défaut (Arabe)
        changeLanguage('ar');
        setInterval(updateCountdown, 1000);
        updateCountdown();
        updateMessages();
        createParticles();
    </script>
</body>
</html>
