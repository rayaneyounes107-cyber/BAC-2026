  html[dir="ltr"] .lang-switcher{right:20px; left:auto;}

  .lang-btn.active{background:var(--green); color:#fff;}
  .lang-btn:not(.active):hover{color:var(--text);}

/* =========================================================================
   FOND ANIMÉ — lignes ondulantes façon "LineWaves", en Canvas 2D pur
   (inspiré du shader WebGL du site de référence, réécrit sans dépendance)
========================================================================= */
(function initWaveBackground(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const colors = [
    'rgba(31,138,76,0.35)',   // vert
    'rgba(237,237,237,0.18)', // blanc
    'rgba(200,16,46,0.30)'    // rouge
  ];

  let mouseX = 0.5, mouseY = 0.5, targetX = 0.5, targetY = 0.5;
  window.addEventListener('mousemove', e => {
    targetX = e.clientX / window.innerWidth;
    targetY = e.clientY / window.innerHeight;
  });

  function resize(){
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  let t = 0;
  function draw(){
    t += reduceMotion ? 0 : 0.006;
    mouseX += (targetX - mouseX) * 0.03;
    mouseY += (targetY - mouseY) * 0.03;

    ctx.clearRect(0, 0, w, h);

    const lineCount = 22;
    for(let i = 0; i < lineCount; i++){
      const progress = i / lineCount;
      const colorIdx = i % colors.length;
      ctx.beginPath();
      ctx.strokeStyle = colors[colorIdx];
      ctx.lineWidth = 1.2;

      const baseY = h * 0.15 + progress * h * 0.7;
      const parallax = (mouseY - 0.5) * 40 * (1 - Math.abs(progress - 0.5) * 1.4);

      for(let x = 0; x <= w; x += 12){
        const nx = x / w;
        const wave =
          Math.sin(nx * 3.2 + t * 1.3 + progress * 6) * 18 +
          Math.sin(nx * 1.4 - t * 0.8 + progress * 3) * 26 +
          (mouseX - 0.5) * 30 * Math.sin(nx * Math.PI);
        const y = baseY + wave + parallax;
        if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }
  draw();
})();

  document.getElementById("chat-input").placeholder = data.chatPlaceholder;

  document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
  document.getElementById("btn-" + lang).classList.add("active");

  updateMessages();
}

function updateMessages(){
  const data = i18n[currentLang];
  messageEl.textContent = data.messages[Math.floor(Math.random() * data.messages.length)];
  quoteEl.textContent = `"${data.quotes[Math.floor(Math.random() * data.quotes.length)]}"`;
}

function updateCountdown(){
  const now = new Date().getTime();
  const diff = targetDate - now;
  const data = i18n[currentLang];

  if(diff < 0){
    weeksEl.textContent = "00"; daysEl.textContent = "00"; hoursEl.textContent = "00";
    minutesEl.textContent = "00"; secondsEl.textContent = "00";
    messageEl.textContent = data.msgDone; quoteEl.textContent = "";
    progressBarEl.style.width = "100%"; progressPercentageEl.textContent = "100%";
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);
  const seconds = totalSeconds % 60;
  const totalMinutes = Math.floor(totalSeconds / 60);
  const totalHours = Math.floor(totalSeconds / 3600);
  const totalDays = Math.floor(totalSeconds / (3600 * 24));
  const weeks = Math.floor(totalDays / 7);

  weeksEl.textContent = weeks;
  daysEl.textContent = totalDays;
  hoursEl.textContent = totalHours;
  minutesEl.textContent = totalMinutes;
  secondsEl.textContent = totalSeconds;

  const progressPercent = Math.min(Math.max((now - startDate) / (targetDate - startDate) * 100, 0), 100);
  progressBarEl.style.width = `${progressPercent}%`;
  progressPercentageEl.textContent = `${progressPercent.toFixed(1)}%`;

  if(seconds % 15 === 0) updateMessages();
}

changeLanguage('ar');
setInterval(updateCountdown, 1000);
updateCountdown();
updateMessages();

/* ================= CHAT LOGIC ================= */
const chatFab = document.getElementById('chat-fab');
const chatPanel = document.getElementById('chat-panel');
const chatClose = document.getElementById('chat-close');
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');

chatFab.addEventListener('click', () => chatPanel.classList.toggle('open'));
chatClose.addEventListener('click', () => chatPanel.classList.remove('open'));

let history = [];

function addMessage(text, who){
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

/* Réponses de secours locales — utilisées si l'appel à l'IA échoue
   (même logique que le "fallbackAdvise" du site Eurl TCP fourni en référence) */
function localFallbackAnswer(text){
  const q = text.toLowerCase().trim();
  const lang = currentLang;

  const greet = { ar: "مرحبا! أنا مساعد موقع بكالوريا 2027.", fr: "Bonjour ! Je suis l'assistant du site Bac 2027.", en: "Hi! I'm the Bac 2027 site assistant." };
  const discordReply = {
    ar: `يمكنك الانضمام إلى سيرفر "${discordInfo.serverName}" عبر الرابط: ${discordInfo.inviteLink}. السيرفر فيه: ${discordInfo.channels}.`,
    fr: `Tu peux rejoindre le serveur "${discordInfo.serverName}" via ce lien : ${discordInfo.inviteLink}. Il contient : ${discordInfo.channels}.`,
    en: `You can join the "${discordInfo.serverName}" server here: ${discordInfo.inviteLink}. It includes: ${discordInfo.channels}.`
  };
  const motivate = {
    ar: "لا تقلق، التحضير المنتظم يوميًا أفضل من المراجعة المكثفة في آخر لحظة. خصص وقتًا لكل مادة وخذ فترات راحة قصيرة.",
    fr: "Pas de panique : une préparation régulière chaque jour vaut mieux qu'un bachotage de dernière minute. Répartis ton temps entre matières et prends de courtes pauses.",
    en: "No worries: steady daily prep beats last-minute cramming. Split your time across subjects and take short breaks."
  };
  const fallback = {
    ar: "لم أستطع الاتصال بالذكاء الاصطناعي الآن، لكن يمكنني إخبارك بمعلومات عن الموقع أو سيرفر ديسكورد الخاص بنا.",
    fr: "Je n'ai pas pu contacter l'IA à l'instant, mais je peux te renseigner sur le site ou notre serveur Discord.",
    en: "I couldn't reach the AI right now, but I can tell you about the site or our Discord server."
  };

  if(/^(salut|bonjour|hello|hey|سلام|مرحبا)/.test(q)) return greet[lang];
  if(q.includes('discord')) return discordReply[lang];
  if(q.includes('stress') || q.includes('خايف') || q.includes('قلق') || q.includes('anxious') || q.includes('anxieux')) return motivate[lang];
  return fallback[lang];
}

function buildSystemPrompt(){
  return `Tu es l'assistant du site de compte à rebours du Bac 2027 (Algérie). Réponds brièvement (2-4 phrases), de façon motivante et claire, dans la langue de la question (arabe, français ou anglais selon ce que l'utilisateur utilise). Tu peux parler du serveur Discord suivant lorsqu'on te le demande : nom "${discordInfo.serverName}", description: ${discordInfo.description}, salons: ${discordInfo.channels}, règles: ${discordInfo.rules}, lien d'invitation: ${discordInfo.inviteLink}. Tu n'as PAS accès aux messages ou membres en temps réel du serveur, seulement à ces informations statiques. Si on te demande une donnée live que tu n'as pas, dis-le honnêtement et renvoie vers le serveur Discord.`;
}

async function sendChat(){
  const text = chatInput.value.trim();
  if(!text) return;
  addMessage(text, 'user');
  history.push({ role: 'user', content: text });
  chatInput.value = '';

  const typingEl = addMessage('...', 'bot typing');

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 400,
        system: buildSystemPrompt(),
        messages: history
      })
    });
    const data = await response.json();
    const reply = (data.content || []).map(b => b.text || "").join("\n").trim() || "…";
    typingEl.remove();
    addMessage(reply, 'bot');
    history.push({ role: 'assistant', content: reply });
  }catch(err){
    typingEl.remove();
    addMessage(localFallbackAnswer(text), 'bot');
  }
}

chatSend.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendChat(); });
</script>
